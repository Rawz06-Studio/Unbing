[package]
name = "unbing"
version = "0.1.0"
edition = "2024"
description = "Bing's picture of the day as your wallpaper. No telemetry, no account, no tracking."
license = "MIT"
repository = "https://github.com/Rawz06-Studio/Unbing"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = "0.6"
self-replace = "1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
ureq = "3.5"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSView", "NSVisualEffectView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSThread"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
