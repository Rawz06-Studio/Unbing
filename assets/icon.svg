<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Dawn sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E4BC6"/>
      <stop offset="0.55" stop-color="#7A6BE0"/>
      <stop offset="1" stop-color="#FFB27A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset="1" stop-color="#FFD27A"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE3A8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFE3A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A4FB8"/>
      <stop offset="1" stop-color="#3E3794"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26246E"/>
      <stop offset="1" stop-color="#15154A"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0C0C3A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background (macOS icon grid: 824px rounded square inside 1024) -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <circle cx="512" cy="560" r="300" fill="url(#glow)"/>
    <circle cx="512" cy="560" r="138" fill="url(#sun)"/>
    <!-- Far ridge -->
    <path fill="url(#far)" d="M100 640 C 210 560, 300 548, 392 598 C 470 640, 540 600, 620 560 C 720 510, 830 548, 924 610 L 924 924 L 100 924 Z"/>
    <!-- Near hills -->
    <path fill="url(#near)" filter="url(#shadow)" d="M100 742 C 230 668, 360 668, 480 720 C 600 772, 720 742, 820 700 C 860 684, 896 680, 924 684 L 924 924 L 100 924 Z"/>
  </g>
</svg>
